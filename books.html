<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خۆشترین کتێبەکان - ماڵپەڕی ڕوانگە</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .post-card {
            background-color: #1a1d2b;
            border: 1px solid #222634;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        /* ستایلی وێنەکە */
        .my-custom-book-img {
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 2px solid #2d3245;
            margin: 20px 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .comments-section {
            background-color: #12141d;
            border: 1px solid #222634;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .comment-input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .comment-input-box input, 
        .comment-input-box textarea {
            width: 100%;
            background-color: #1a1d2b;
            border: 1px solid #2d3245;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .comment-input-box button {
            align-self: flex-start;
            background-color: #4f46e5;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main class="page-container">
        
        <article class="post-card">
            <h1 style="color: #ffc107;">📚 خۆشترین کتێبەکانی ساڵ</h1>
            
            <!-- وێنەی کتێبەکە -->
            <img src="book.jpg" alt="خۆشترین کتێبەکان" class="my-custom-book-img">
            
            <div style="background: #12141d; text-align: right; padding: 15px; border-radius: 8px; border-right: 4px solid #4caf50; border: 1px solid #222634;">
                <h3 style="color: #4caf50; margin-bottom: 10px;">📖 پێشنیارەکانی ڕوانگە:</h3>
                <p style="color: #ccc; margin-bottom: 5px;">• کتێبی ١: ناوی کتێبەکە — کورتەیەک دەربارەی کتێبەکە</p>
                <p style="color: #ccc;">• کتێبی ٢: ناوی کتێبەکە — کورتەیەک دەربارەی کتێبەکە</p>
            </div>
        </article>

        <!-- بەشی کۆمێنتەکان -->
        <section class="comments-section">
            <h3 style="color: #ffc107; font-size: 20px; margin-bottom: 20px;">💬 ڕا و پێشنیاری بینەران</h3>

            <div class="comment-input-box">
                <input type="text" placeholder="ناوی تۆ...">
                <textarea rows="3" placeholder="ڕا یان پێشنیاری خۆت دەربارەی کتێب بنووسە..."></textarea>
                <button type="button">ناردنی کۆمێنت 🚀</button>
            </div>
        </section>

        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" class="btn-back">⬅ گەڕانەوە بۆ لاپەڕەی سەرەکی</a>
        </div>

    </main>

</body>
</html>
