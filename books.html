<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خۆشترین کتێبەکان - ماڵپەڕی ڕوانگە</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        /* 🖼️ سندوقەکە کە وێنەکە بوەتە باکگراوندی */
        .post-card-with-bg {
            background-image: linear-gradient(rgba(18, 20, 29, 0.85), rgba(18, 20, 29, 0.95)), url('books.jpeg');
            background-size: cover;
            background-position: center;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .comments-section {
            background-color: #12141d;
            border: 1px solid #222634;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .comment-input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .comment-input-box input, 
        .comment-input-box textarea {
            width: 100%;
            background-color: #1a1d2b;
            border: 1px solid #2d3245;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .comment-input-box button {
            align-self: flex-start;
            background-color: #4f46e5;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .comment-input-box button:hover {
            background-color: #4338ca;
        }

        .comment-card {
            background-color: #1a1d2b;
            border: 1px solid #282d3f;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            background-color: #31374a;
            color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <main class="page-container">
        
        <article class="post-card-with-bg">
            <h1 style="color: #ffc107; margin-bottom: 15px;">📚 خۆشترین کتێبەکانی ساڵ</h1>
            
            <div style="background: rgba(18, 20, 29, 0.7); text-align: right; padding: 20px; border-radius: 10px; border-right: 4px solid #4caf50; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); margin-top: 20px;">
                <h3 style="color: #4caf50; margin-bottom: 10px;">📖 پێشنیارەکانی ڕوانگە:</h3>
                <p style="color: #fff; margin-bottom: 8px;">• کتێبی ١: ناوی کتێبەکە — کورتەیەک دەربارەی کتێبەکە</p>
                <p style="color: #fff;">• کتێبی ٢: ناوی کتێبەکە — کورتەیەک دەربارەی کتێبەکە</p>
            </div>
        </article>

        <section class="comments-section">
            <h3 style="color: #ffc107; font-size: 20px; margin-bottom: 20px;">💬 ڕا و پێشنیاری بینەران</h3>

            <div class="comment-input-box">
                <input type="text" id="userName" placeholder="ناوی تۆ...">
                <textarea id="userComment" rows="3" placeholder="ڕا یان پێشنیاری خۆت دەربارەی کتێب بنووسە..."></textarea>
                <button type="button" onclick="sendComment()">ناردنی کۆمێنت 🚀</button>
            </div>

            <hr style="border: 0.5px solid #222634; margin-bottom: 20px;">

            <!-- لێرە کۆمێنتەکان بۆ هەمووان ڕاستەوخۆ دەردەکەون -->
            <div id="commentsContainer"></div>
        </section>

        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" class="btn-back">⬅ گەڕانەوە بۆ لاپەڕەی سەرەکی</a>
        </div>

    </main>

    <!-- ⚡ جافاسکریپت + بەستنەوە بە دەیتابەیسەکەت ⚡ -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rwanga-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendComment() {
            const name = document.getElementById("userName").value.trim();
            const message = document.getElementById("userComment").value.trim();

            if (name === "" || message === "") {
                alert("تکایە ناو و کۆمێنت بنووسە!");
                return;
            }

            database.ref("comments").push({
                name: name,
                message: message
            });

            document.getElementById("userName").value = "";
            document.getElementById("userComment").value = "";
        }

        database.ref("comments").on("child_added", function(snapshot) {
            const data = snapshot.val();
            const firstLetter = data.name ? data.name.charAt(0) : "؟";

            const commentHTML = `
                <div class="comment-card">
                    <div class="user-avatar">${firstLetter}</div>
                    <div class="comment-content">
                        <h4 style="color: #fff; margin-bottom: 4px;">${data.name}</h4>
                        <p style="color: #a0a6b8; font-size: 14px;">${data.message}</p>
                    </div>
                </div>
            `;
            document.getElementById("commentsContainer").innerHTML += commentHTML;
        });
    </script>
</body>
</html>
