<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خۆشترین فیلمەکان - ماڵپەڕی ڕوانگە</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .post-card-with-bg {
            background-image: linear-gradient(rgba(18, 20, 29, 0.85), rgba(18, 20, 29, 0.95)), url('movies.jpeg');
            background-size: cover;
            background-position: center;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .comments-section {
            background-color: #12141d;
            border: 1px solid #222634;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .comment-input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .comment-input-box input, 
        .comment-input-box textarea {
            width: 100%;
            background-color: #1a1d2b;
            border: 1px solid #2d3245;
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .comment-input-box button {
            align-self: flex-start;
            background-color: #4f46e5;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .comment-input-box button:hover {
            background-color: #4338ca;
        }

        .comment-card {
            background-color: #1a1d2b;
            border: 1px solid #282d3f;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            background-color: #31374a;
            color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .btn-back {
            display: inline-block;
            background-color: #21262d;
            color: #c9d1d9;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #30363d;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #30363d;
            color: #fff;
        }
    </style>
</head>
<body>

    <main class="page-container">
        
        <article class="post-card-with-bg">
            <h1 style="color: #ffc107; margin-bottom: 15px;">🎬 خۆشترین فیلمەکانی ساڵ</h1>
            
            <div style="background: rgba(18, 20, 29, 0.7); text-align: right; padding: 20px; border-radius: 10px; border-right: 4px solid #4caf50; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); margin-top: 20px;">
                <h3 style="color: #4caf50; margin-bottom: 10px;">🍿 پێشنیارەکانی ڕوانگە بۆ فیلم:</h3>
                <p style="color: #fff; margin-bottom: 8px;">• فیلمی ١: ناوی فیلمەکە — کورتەیەک دەربارەی فیلمەکە</p>
                <p style="color: #fff;">• فیلمی ٢: ناوی فیلمەکە — کورتەیەک دەربارەی فیلمەکە</p>
            </div>
        </article>

        <section class="comments-section">
            <h3 style="color: #ffc107; font-size: 20px; margin-bottom: 20px;">💬 ڕا و پێشنیاری بینەران</h3>

            <div class="comment-input-box">
                <input type="text" id="userName" placeholder="ناوی تۆ...">
                <textarea id="userComment" rows="3" placeholder="ڕا یان پێشنیاری خۆت دەربارەی فیلم بنووسە..."></textarea>
                <button type="button" onclick="sendComment()">ناردنی کۆمێنت 🚀</button>
            </div>

            <hr style="border: 0.5px solid #222634; margin-bottom: 20px;">

            <div id="commentsContainer"></div>
        </section>

        <div style="text-align: center; margin-top: 30px;">
            <a href="index.html" class="btn-back">⬅ گەڕانەوە بۆ لاپەڕەی سەرەکی</a>
        </div>

    </main>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rwanga-default-rtdb.firebaseio.com"
        };
        
        // Check if firebase is already initialized to prevent double init error
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const database = firebase.database();
        const ADMIN_PASSWORD = "rwanga77";

        function sendComment() {
            const nameInput = document.getElementById("userName");
            const messageInput = document.getElementById("userComment");
            
            const name = nameInput.value.trim();
            const message = messageInput.value.trim();

            if (name === "" || message === "") {
                alert("تکایە ناو و کۆمێنت بنووسە!");
                return;
            }

            database.ref("movie_comments").push({
                name: name,
                message: message
            }).then(() => {
                nameInput.value = "";
                messageInput.value = "";
            }).catch((error) => {
                alert("هەڵەیەک ڕووی دا لەناردنی کۆمێنت: " + error.message);
            });
        }

        database.ref("movie_comments").on("value", function(snapshot) {
            const container = document.getElementById("commentsContainer");
            container.innerHTML = "";

            if (!snapshot.exists()) {
                container.innerHTML = '<p style="color: #8b949e; text-align: center;">هێشتا هیچ کۆمێنتێک نییە. یەکەم کەس ببنە ڕاکەتان بنووسن!</p>';
                return;
            }

            snapshot.forEach(function(childSnapshot) {
                const key = childSnapshot.key;
                const data = childSnapshot.val();
                const firstLetter = data.name ? data.name.charAt(0) : "؟";

                const commentHTML = `
                    <div class="comment-card" id="card-${key}">
                        <div class="comment-left">
                            <div class="user-avatar">${firstLetter}</div>
                            <div class="comment-content">
                                <h4 style="color: #fff; margin-bottom: 4px;">${data.name}</h4>
                                <p style="color: #a0a6b8; font-size: 14px; word-break: break-word;">${data.message}</p>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteComment('${key}')" title="سڕینەوە">🗑️</button>
                    </div>
                `;
                container.innerHTML += commentHTML;
            });
        });

        function deleteComment(key) {
            const password = prompt("تکایە وشەی نهێنی (پاسوۆرد)ی بەڕێوەبەر بنووسە بۆ سڕینەوە:");
            
            if (password === ADMIN_PASSWORD) {
                database.ref("movie_comments/" + key).remove().then(() => {
                    alert("کۆمێنتەکە بە سەرکەوتوویی سڕدرایەوە!");
                }).catch((error) => {
                    alert("هەڵە ڕووی دا لە سڕینەوە: " + error.message);
                });
            } else if (password !== null) {
                alert("وشەی نهێنی هەڵەیە! تەنها بەڕێوەبەر دەتوانێت کۆمێنت بسڕێتەوە.");
            }
        }
    </script>
</body>
</html>
