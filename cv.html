<!-- بەشی دیاریکردنی ئاستی زمانەکان -->
<div style="margin-top: 15px; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333;">
    <h3 style="color: #ffc107; margin-bottom: 10px;">🌐 ئاستی زمانەکان</h3>

    <!-- 1. زمانی ئینگلیزی -->
    <label style="font-weight: bold; display: block; margin-bottom: 8px;">ئاستی زمانی ئینگلیزی:</label>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
        <label><input type="radio" name="english_level" value="A1" required> A1 (سەرەتایی)</label>
        <label><input type="radio" name="english_level" value="A2"> A2 (بنەڕەتی)</label>
        <label><input type="radio" name="english_level" value="B1"> B1 (ناوەند)</label>
        <label><input type="radio" name="english_level" value="B2"> B2 (سەروو ناوەند)</label>
        <label><input type="radio" name="english_level" value="C1"> C1 (پێشکەوتوو)</label>
        <label><input type="radio" name="english_level" value="C2"> C2 (شارەزای تەواو)</label>
    </div>

    <hr style="border: 0.5px solid #333; margin: 10px 0;">

    <!-- 2. زمانی عەرەبی -->
    <label style="font-weight: bold; display: block; margin-bottom: 8px;">ئاستی زمانی عەرەبی:</label>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <label><input type="radio" name="arabic_level" value="A1" required> A1 (سەرەتایی)</label>
        <label><input type="radio" name="arabic_level" value="A2"> A2 (بنەڕەتی)</label>
        <label><input type="radio" name="arabic_level" value="B1"> B1 (ناوەند)</label>
        <label><input type="radio" name="arabic_level" value="B2"> B2 (سەروو ناوەند)</label>
        <label><input type="radio" name="arabic_level" value="C1"> C1 (پێشکەوتوو)</label>
        <label><input type="radio" name="arabic_level" value="C2"> C2 (شارەزای تەواو)</label>
    </div>
</div>
